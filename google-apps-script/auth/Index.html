<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ScriptFlow secure sign-in</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f4f6fb;color:#172033;margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}
    .card{width:min(440px,100%);background:#fff;border:1px solid #e4e9f1;border-radius:14px;padding:30px;box-shadow:0 12px 40px #15234212}
    h1{font-size:24px;margin:0 0 8px}.muted{color:#667085;font-size:13px;line-height:1.6}
    .identity{background:#f1f5f9;padding:13px;border-radius:8px;margin:20px 0;font-size:13px}
    button{width:100%;padding:12px 16px;border:0;border-radius:8px;background:#2857d9;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}.error{color:#b42318;background:#fff1f0;padding:12px;border-radius:8px;font-size:13px;display:none}
  </style>
</head>
<body>
  <main class="card">
    <h1>ScriptFlow</h1>
    <p class="muted">Secure sign-in using your Bilendi Google Workspace account.</p>
    <div class="identity" id="identity">Checking your company account…</div>
    <div class="error" id="error"></div>
    <button id="continue" disabled onclick="continueToScriptFlow()">Continue to ScriptFlow</button>
    <p class="muted">This page is restricted to authorised Bilendi employees.</p>
  </main>
  <script>
    var identity = null;
    var state = new URLSearchParams(window.location.search).get('state') || '';

    function showError(message) {
      var box = document.getElementById('error');
      box.textContent = message || 'Sign-in failed. Please try again.';
      box.style.display = 'block';
      document.getElementById('continue').disabled = true;
    }

    google.script.run
      .withSuccessHandler(function(user) {
        identity = user;
        document.getElementById('identity').textContent =
          user.email + ' · ' + user.role.replace(/_/g, ' ');
        document.getElementById('continue').disabled = false;
      })
      .withFailureHandler(function(error) {
        showError(error && error.message ? error.message : String(error));
      })
      .getSignInIdentity();

    function continueToScriptFlow() {
      if (!identity || !/^[A-Za-z0-9_-]{32,160}$/.test(state)) {
        showError('The sign-in request is invalid or has expired. Return to ScriptFlow and try again.');
        return;
      }
      var button = document.getElementById('continue');
      button.disabled = true;
      button.textContent = 'Signing you in…';

      google.script.run
        .withSuccessHandler(function(result) {
          var callback = result.callbackUrl.replace(/#.*$/, '');
          window.location.replace(callback + '#token=' +
            encodeURIComponent(result.token) + '&state=' +
            encodeURIComponent(state));
        })
        .withFailureHandler(function(error) {
          button.textContent = 'Continue to ScriptFlow';
          showError(error && error.message ? error.message : String(error));
        })
        .issueAuthToken(state);
    }
  </script>
</body>
</html>
